name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  vendor:
    name: vendor/botd matches the pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/update-botd.sh
      - name: vendored build must equal a fresh build of the pinned version
        run: git diff --exit-code -- vendor/

  specs:
    name: specs on ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [ "lucee@6.2.7+16", "boxlang@1.18" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: Ortus-Solutions/setup-commandbox@v2
      - run: box install
      - run: box server start cfengine=${{ matrix.engine }} port=60099 openbrowser=false saveSettings=false
      - name: run tests/runner.cfm
        run: |
          curl -sf "http://127.0.0.1:60099/tests/runner.cfm?reporter=json" > result.json
          node -e "const r=require('./result.json'); console.log('passed', r.totalPass, 'failed', r.totalFail, 'errors', r.totalError); process.exit((r.totalFail|0)+(r.totalError|0) ? 1 : 0)"
      - name: text report on failure
        if: failure()
        run: curl -s "http://127.0.0.1:60099/tests/runner.cfm?reporter=text" || true
